# ================================================
# AI Medical Assistant - Application Configuration
# ================================================

# Server
server.port=${PORT:8080}

# ------------------------------------------------
# Database Configuration
# ------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_medical_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------
# JWT Configuration
# ------------------------------------------------
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# ------------------------------------------------
# Groq API Configuration
# ------------------------------------------------
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model.text=llama-3.3-70b-versatile
groq.model.vision=llama-3.2-11b-vision-preview

# ------------------------------------------------
# File Upload Configuration
# ------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=uploads

# ------------------------------------------------
# CORS (allow React frontend)
# ------------------------------------------------
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}

# ------------------------------------------------
# Logging
# ------------------------------------------------
logging.level.com.medical=INFO
logging.level.org.springframework.security=WARN
